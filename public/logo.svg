<svg viewBox="0 0 620 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bb-chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2836" />
      <stop offset="50%" stop-color="#111721" />
      <stop offset="100%" stop-color="#080C10" />
    </linearGradient>
    <linearGradient id="bb-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bb-bevel-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00E599" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="bb-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emblem Symbol -->
  <g transform="translate(10, 10)">
    <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#bb-chassis-grad)" stroke="url(#bb-bevel-stroke)" stroke-width="1.8" />
    <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="50" cy="50" r="38" fill="url(#bb-ambient-glow)" />
    <circle cx="50" cy="50" r="36" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="50" cy="50" r="26" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="2 2" />

    <path d="M 24 24 C 24 20.686 26.686 18 30 18 C 33.314 18 36 20.686 36 24 V 76 C 36 79.314 33.314 82 30 82 C 26.686 82 24 79.314 24 76 Z" fill="url(#bb-emerald-grad)" />
    <path d="M 36 22 H 56 C 68.15 22 76 29.85 76 40 C 76 48.2 70.8 54.8 62 56 C 53.5 54 44 52 36 50 Z" fill="url(#bb-emerald-grad)" fill-opacity="0.9" />
    <path d="M 36 48 C 46 48 58 50 66 52 C 76.5 54.5 82 62.5 82 71 C 82 80 73 82 58 82 H 36 Z" fill="url(#bb-emerald-grad)" />

    <path d="M 44 30 H 54 C 61 30 65 34 65 39 C 65 44 61 46 54 46 H 44 Z" fill="#0A0E13" />
    <path d="M 44 56 H 56 C 64 56 69 61 69 67 C 69 73 64 76 56 76 H 44 Z" fill="#0A0E13" />

    <polygon points="48,34 56,39 48,44" fill="url(#bb-gold-grad)" />
    <polygon points="48,62 58,67 48,72" fill="url(#bb-gold-grad)" />

    <circle cx="30" cy="28" r="1.5" fill="#FFFFFF" />
    <circle cx="30" cy="38" r="1.5" fill="#34D399" />
    <circle cx="30" cy="48" r="1.5" fill="#00E599" />
    <circle cx="30" cy="58" r="1.5" fill="#FBBF24" />
    <circle cx="30" cy="68" r="1.5" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <text x="135" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">BEATS</text>
  <text x="295" y="65" fill="url(#bb-emerald-grad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">BAZAAR</text>
  <circle cx="495" cy="50" r="5" fill="#F59E0B" />

  <text x="138" y="92" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="4">BEAT MARKETPLACE &amp; 24/7 CYPHER ROOM</text>
