<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aerospace Titanium Base Plate Gradient -->
    <linearGradient id="bb-chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2836" />
      <stop offset="50%" stop-color="#111721" />
      <stop offset="100%" stop-color="#080C10" />
    </linearGradient>

    <!-- Neon Cyber Emerald Core -->
    <linearGradient id="bb-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Studio Analog Gold -->
    <linearGradient id="bb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Outer Chamfer Edge Stroke -->
    <linearGradient id="bb-bevel-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00E599" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Radial Core Light -->
    <radialGradient id="bb-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Squircle Chassis -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="120"
    fill="url(#bb-chassis-grad)"
    stroke="url(#bb-bevel-stroke)"
    stroke-width="8"
  />

  <!-- Precision Hardware Inset Groove -->
  <rect
    x="44"
    y="44"
    width="424"
    height="424"
    rx="100"
    fill="none"
    stroke="#000000"
    stroke-width="8"
    stroke-opacity="0.7"
  />

  <!-- Ambient Lighting Field -->
  <circle cx="256" cy="256" r="190" fill="url(#bb-ambient-glow)" />

  <!-- Vinyl Soundwave Concentric Precision Rings -->
  <circle cx="256" cy="256" r="180" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="14 12" />
  <circle cx="256" cy="256" r="130" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Sculptural "BB" Soundwave Monolith -->
  <!-- Main Vertical Frequency Spine -->
  <path
    d="M 124 124 C 124 107.4 137.4 94 154 94 C 170.6 94 184 107.4 184 124 V 388 C 184 404.6 170.6 418 154 418 C 137.4 418 124 404.6 124 388 Z"
    fill="url(#bb-emerald-grad)"
  />

  <!-- Upper Resonator Wave Chamber (Top 'B') -->
  <path
    d="M 184 114 H 284 C 346 114 386 154 386 206 C 386 248 360 280 314 286 C 270 276 224 266 184 256 Z"
    fill="url(#bb-emerald-grad)"
    fill-opacity="0.92"
  />

  <!-- Lower Resonator Wave Chamber (Bottom 'B') -->
  <path
    d="M 184 246 C 236 246 296 256 338 266 C 390 280 418 320 418 364 C 418 410 372 420 294 420 H 184 Z"
    fill="url(#bb-emerald-grad)"
  />

  <!-- Precision Laser-Etched Sound Ports (Negative Space Cavities) -->
  <path
    d="M 224 154 H 274 C 310 154 330 174 330 200 C 330 226 310 236 274 236 H 224 Z"
    fill="#0A0E13"
  />
  <path
    d="M 224 286 H 284 C 326 286 352 312 352 344 C 352 374 326 390 284 390 H 224 Z"
    fill="#0A0E13"
  />

  <!-- Analog Gold Transducer Prism (Golden Playhead Core) -->
  <polygon
    points="246,174 286,200 246,226"
    fill="url(#bb-gold-grad)"
  />
  <polygon
    points="246,318 296,344 246,370"
    fill="url(#bb-gold-grad)"
  />

  <!-- Dynamic LED VU-Meter Level Indicators on Spine -->
  <circle cx="154" cy="144" r="8" fill="#FFFFFF" />
  <circle cx="154" cy="196" r="8" fill="#34D399" />
  <circle cx="154" cy="248" r="8" fill="#00E599" />
  <circle cx="154" cy="300" r="8" fill="#FBBF24" />
  <circle cx="154" cy="352" r="8" fill="#F59E0B" />
</svg>
