<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Titanium Plaque Surface -->
    <linearGradient id="plaque-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2734" />
      <stop offset="45%" stop-color="#121822" />
      <stop offset="100%" stop-color="#090D12" />
    </linearGradient>

    <!-- Chamfered Plaque Bevel -->
    <linearGradient id="plaque-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#00E599" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>

    <!-- 24K Brushed Gold Vinyl Master Disc -->
    <radialGradient id="gold-master-disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="88%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Dark Obsidian Center Sound Well -->
    <radialGradient id="center-sound-well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161F2B" />
      <stop offset="70%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Neon Emerald Glow for Center Monogram -->
    <linearGradient id="neon-bb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Corner Hex-Bolt Gold -->
    <linearGradient id="hex-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Circular Text Arc Paths -->
    <path id="arc-crown-512" d="M 98 256 A 158 158 0 0 1 414 256" />
    <path id="arc-left-512" d="M 108 348 A 158 158 0 0 1 158 164" />
    <path id="arc-right-512" d="M 354 164 A 158 158 0 0 1 404 348" />
  </defs>

  <!-- 1. Floating Anodized Hardware Plaque (Transparent Background) -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="112"
    fill="url(#plaque-body)"
    stroke="url(#plaque-bevel)"
    stroke-width="9"
  />

  <!-- Precision Inset Rim -->
  <rect
    x="44"
    y="44"
    width="424"
    height="424"
    rx="92"
    fill="none"
    stroke="#000000"
    stroke-width="8"
    stroke-opacity="0.7"
  />

  <!-- 2. Four Precision Industrial Gold Corner Hex-Bolts -->
  <!-- Top-Left -->
  <polygon points="64,52 77,59.5 77,74.5 64,82 51,74.5 51,59.5" fill="url(#hex-bolt)" />
  <circle cx="64" cy="67" r="6" fill="#0A0E13" />
  <!-- Top-Right -->
  <polygon points="448,52 461,59.5 461,74.5 448,82 435,74.5 435,59.5" fill="url(#hex-bolt)" />
  <circle cx="448" cy="67" r="6" fill="#0A0E13" />
  <!-- Bottom-Left -->
  <polygon points="64,430 77,437.5 77,452.5 64,460 51,452.5 51,437.5" fill="url(#hex-bolt)" />
  <circle cx="64" cy="445" r="6" fill="#0A0E13" />
  <!-- Bottom-Right -->
  <polygon points="448,430 461,437.5 461,452.5 448,460 435,452.5 435,437.5" fill="url(#hex-bolt)" />
  <circle cx="448" cy="445" r="6" fill="#0A0E13" />

  <!-- 3. Gold Master Disc Plate -->
  <circle cx="256" cy="256" r="174" fill="url(#gold-master-disc)" stroke="#92400E" stroke-width="5" />

  <!-- Precision Audio Concentric Micro-Grooves -->
  <circle cx="256" cy="256" r="154" stroke="#78350F" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="30 10" />
  <circle cx="256" cy="256" r="133" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="20 10" />
  <circle cx="256" cy="256" r="112" stroke="#78350F" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="25 15" />

  <!-- 4. Engraved Text on the Disc Rim -->
  <!-- CROWN: BEATS BAZAAR Prominently at Top Center of the Curve -->
  <text>
    <textPath 
      href="#arc-crown-512" 
      startOffset="50%" 
      text-anchor="middle" 
      fill="#2A1A04" 
      font-size="22" 
      font-weight="900" 
      letter-spacing="5"
    >
      BEATS BAZAAR
    </textPath>
  </text>

  <!-- Left Arc: VERIFIED MASTER curving up towards BEATS BAZAAR -->
  <text>
    <textPath 
      href="#arc-left-512" 
      startOffset="50%" 
      text-anchor="middle" 
      fill="#52360B" 
      font-size="14" 
      font-weight="800" 
      letter-spacing="4"
    >
      VERIFIED MASTER
    </textPath>
  </text>

  <!-- Right Arc: LEGAL RIGHTS curving up towards BEATS BAZAAR -->
  <text>
    <textPath 
      href="#arc-right-512" 
      startOffset="50%" 
      text-anchor="middle" 
      fill="#52360B" 
      font-size="14" 
      font-weight="800" 
      letter-spacing="4"
    >
      LEGAL RIGHTS
    </textPath>
  </text>

  <!-- 5. Center High-Contrast Sound Chamber for Bold Double "BB" Visibility -->
  <circle 
    cx="256" 
    cy="256" 
    r="84" 
    fill="url(#center-sound-well)" 
    stroke="#00E599" 
    stroke-width="9"
  />

  <!-- 6. Bold, Sculpted, High-Contrast Interlocking "BB" Monogram -->
  <!-- Main Left Frequency Stem (Thick & Solid) -->
  <rect 
    x="204" 
    y="204" 
    width="18" 
    height="104" 
    rx="9" 
    fill="url(#neon-bb)"
  />

  <!-- Upper Resonator 'B' Loop (Bold 17px Stroke) -->
  <path
    d="M 220 216 C 252 216, 292 224, 292 242 C 292 260, 252 262, 220 262"
    stroke="url(#neon-bb)"
    stroke-width="17"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Lower Resonator 'B' Loop (Bold 17px Stroke) -->
  <path
    d="M 220 258 C 256 258, 302 266, 302 286 C 302 306, 256 308, 220 308"
    stroke="url(#neon-bb)"
    stroke-width="17"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Interlocking Mirrored Reverse 'B' Soundwave Echo -->
  <path
    d="M 204 228 C 184 228, 168 236, 168 246 C 168 256, 184 262, 204 262"
    stroke="#FDE68A"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 204 262 C 178 262, 158 270, 158 282 C 158 296, 178 300, 204 300"
    stroke="#FDE68A"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Studio Playhead Diamond (High Contrast Cyber Core) -->
  <polygon
    points="236,246 261,256 236,266"
    fill="#FFFFFF"
  />
</svg>
