<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bb-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="bb-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17212D" />
      <stop offset="100%" stop-color="#0A0E13" />
    </linearGradient>

    <radialGradient id="bb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Shield -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="120"
    fill="url(#bb-plate)"
    stroke="url(#bb-emerald)"
    stroke-width="12"
    stroke-opacity="0.6"
  />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#bb-glow)" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="186" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="144" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="104" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Dual 'B' Soundwave Monogram -->
  <!-- Vertical Equalizer Spine -->
  <rect x="136" y="124" width="36" height="264" rx="18" fill="url(#bb-emerald)" filter="url(#glow-filter)" />

  <!-- Upper Wave / B Loop -->
  <path
    d="M172 144 C 250 144, 328 164, 328 214 C 328 254, 250 264, 172 264"
    stroke="url(#bb-emerald)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-filter)"
  />

  <!-- Lower Wave / B Loop -->
  <path
    d="M172 244 C 270 244, 356 260, 356 322 C 356 368, 270 388, 172 388"
    stroke="url(#bb-emerald)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-filter)"
  />

  <!-- Cyber Gold Audio Pulse Playhead Triangle -->
  <polygon
    points="236,228 296,256 236,284"
    fill="url(#bb-gold)"
  />

  <!-- Rhythm Accents -->
  <circle cx="390" cy="154" r="16" fill="#00E599" />
  <circle cx="410" cy="204" r="12" fill="#FBBF24" />
  <circle cx="400" cy="360" r="14" fill="#00E599" opacity="0.8" />
</svg>
